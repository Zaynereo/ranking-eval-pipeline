[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ranking-eval-pipeline"
version = "0.1.0"
description = "Offline ranking train/evaluation demo with synthetic data and leakage-resistant splits"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]

[project.scripts]
ranking-pipeline = "ranking_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
